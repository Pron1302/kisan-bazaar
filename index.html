<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Kisan Bazaar</title><meta name="theme-color" content="#2e7d32">
<style>
:root{--g:#2e7d32;--bg:#f4f8f1;--c:#fff;--t:#1b2a1b;--m:#5c6b5c;--b:#dce5d6}
@media(prefers-color-scheme:dark){:root{--bg:#121a12;--c:#1b261b;--t:#e8f0e4;--m:#9db09a;--b:#2c3a2c}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:19px;margin:0}header button{background:#fff3;color:#fff;border:0;padding:6px 11px;border-radius:8px;margin-left:6px}
nav{display:flex;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:12px 2px;border:0;background:none;color:var(--m);font-size:14px;border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--g);font-weight:600}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:5px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:15px}
.btn{background:var(--g);color:#fff;border:0;padding:11px 16px;border-radius:8px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block;margin:2px 0}
.btn.o{background:none;color:var(--g);border:1px solid var(--g)}.m{color:var(--m);font-size:13px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.big{font-size:18px;font-weight:700;color:var(--g)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--b);text-align:left;font-size:14px}
.err{color:#c62828;font-size:14px}.ph{width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-bottom:8px}
</style></head><body>
<header><h1>🌾 <span data-t="app"></span></h1><div id="hu"></div></header>
<nav id="nav"></nav><main id="app"></main>

 'e.E_OTP':'OTP गलत या पुराना है','e.E_WAIT':'थोड़ा रुकें, फिर OTP मांगें','e.E_SMS':'SMS नहीं जा सका','e.E_PHOTO':'फोटो अपलोड नहीं हुई'},
en:{app:'Kisan Bazaar',bazaar:'🛒 Market',rates:'📈 Rates',weather:'⛅ Weather',login:'🔑 Login',acct:'👤 Account',logout:'Logout',

const $=s=>document.querySelector(s);let tab='bazaar',lg=localStorage.lg||'hi',me=JSON.parse(localStorage.me||'null'),tk=localStorage.tk||'',cfg={otp:false},photoId='',reg=false,otpSent=false;
const T=k=>L[lg][k]||L.en[k]||k,errT=e=>T('e.'+e.message)===('e.'+e.message)?e.message:T('e.'+e.message);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:o.body&&JSON.stringify(o.body)});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'E_SRV');return d}
function setAuth(d){tk=d.token;me=d.user;localStorage.tk=tk;localStorage.me=JSON.stringify(me)}
function logout(){tk='';me=null;localStorage.removeItem('tk');localStorage.removeItem('me');go('bazaar')}
function setLg(){lg=lg==='hi'?'en':'hi';localStorage.lg=lg;document.documentElement.lang=lg;render()}
function go(t){tab=t;render()}
function render(){
 document.title=T('app');document.querySelector('[data-t=app]').textContent=T('app');
 $('#hu').innerHTML=(me?`<span class="m" style="color:#fff">${esc(me.name)}</span><button onclick="logout()">${T('logout')}</button>`:'')+`<button onclick="setLg()">${lg==='hi'?'EN':'हिं'}</button>`;
 $('#nav').innerHTML=[['bazaar','bazaar'],['rates','rates'],['weather','weather'],['acc',me?'acct':'login']].map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${T(v)}</button>`).join('');
 ({bazaar,rates,weather,acc})[tab]();
}
async function bazaar(q=''){
 $('#app').innerHTML=`<input id="q" placeholder="${esc(T('search'))}" value="${esc(q)}"><div id="l">…</div>`;
 $('#q').onchange=e=>bazaar(e.target.value);
 try{const ls=await api('listings?q='+encodeURIComponent(q));
 $('#l').innerHTML=ls.length?ls.map(l=>`<div class="card">${l.photo?`<img class="ph" loading="lazy" alt="" src="/api/photo/${esc(l.photo)}">`:''}
 <div class="row"><b>${esc(l.crop)}</b><span class="big">₹${esc(l.price)}/${T('qtl')}</span></div>
 <div class="m">${esc(l.qty)} ${T('qtl')} • ${esc(l.place)} • ${esc(l.farmer)} ${l.rating?`⭐${l.rating.avg} (${l.rating.n})`:''}</div><div style="margin-top:10px">
 ${l.phone?`<a class="btn" href="tel:${esc(l.phone)}">${T('call')}</a> <a class="btn o" target="_blank" rel="noopener" href="https://wa.me/91${esc(l.phone)}?text=${encodeURIComponent(l.crop+' - Kisan Bazaar')}">WhatsApp</a>`:`<span class="m">${T('needLogin')}</span>`}
 ${me&&me.role==='buyer'?` <button class="btn o" onclick="orderAsk('${esc(l.id)}',${+l.qty})">${T('order')}</button>`:''}
 ${me&&me.id===l.owner?` <button class="btn o" onclick="del('${esc(l.id)}')">${T('del')}</button>`:''}</div></div>`).join(''):`<p class="m">${T('none')}</p>`}catch(e){$('#l').innerHTML=`<p class="err">${esc(errT(e))}</p>`}
}
async function del(id){if(confirm(T('confirm'))){await api('listings/'+id,{method:'DELETE'});bazaar()}}
const CROPS=[['Wheat','गेहूं'],['Paddy(Dhan)','धान'],['Soyabean','सोयाबीन'],['Gram','चना'],['Mustard','सरसों'],['Maize','मक्का'],['Onion','प्याज'],['Potato','आलू'],['Tomato','टमाटर'],['Garlic','लहसुन'],['Cotton','कपास']];
const STATES=['Madhya Pradesh','Uttar Pradesh','Maharashtra','Rajasthan','Punjab','Haryana','Gujarat','Bihar','West Bengal','Karnataka','Andhra Pradesh','Telangana','Tamil Nadu','Chhattisgarh','Odisha'];
async function rates(st='',cm=''){
 $('#app').innerHTML=`<div class="card"><b>${T('rT')}</b>
 <input id="st" list="sl" placeholder="${esc(T('state'))}" value="${esc(st)}"><datalist id="sl">${STATES.map(x=>`<option value="${x}">`).join('')}</datalist>
 <input id="cm" list="cl" placeholder="${esc(T('com'))}" value="${esc(cm)}"><datalist id="cl">${CROPS.map(([e,h])=>`<option value="${e}" label="${h}">`).join('')}</datalist>
 <button class="btn" onclick="rates($('#st').value.trim(),$('#cm').value.trim())">${T('find')}</button><div id="rt" style="margin-top:10px">…</div></div>`;
 try{const d=await api('rates?state='+encodeURIComponent(st)+'&commodity='+encodeURIComponent(cm));
 $('#rt').innerHTML=(d.sample?`<p class="m">${T('sample')}</p>`:'')+(d.rates.length?`<div style="overflow-x:auto"><table><tr><th>${T('crop').split(' (')[0]}</th><th>${T('mandi')}</th><th>${T('min')}</th><th>${T('max')}</th><th>${T('modal')}</th><th>${T('date')}</th></tr>
 ${d.rates.map(r=>`<tr><td>${esc(r.commodity)}</td><td>${esc(r.market)}<br><span class="m">${esc(r.district)}, ${esc(r.state)}</span></td><td>${esc(r.min_price)}</td><td>${esc(r.max_price)}</td><td><b>${esc(r.modal_price)}</b></td><td class="m">${esc(r.arrival_date)}</td></tr>`).join('')}</table></div>`:`<p class="m">${T('noData')}</p>`)}
 catch(e){$('#rt').innerHTML=`<p class="err">${esc(errT(e))}</p>`}
}
function weather(){$('#app').innerHTML=`<div class="card"><input id="city" placeholder="${esc(T('city'))}"><button class="btn" onclick="wx()">${T('wx')}</button></div><div id="w"></div>`}
async function wx(){
 const c=$('#city').value.trim();if(!c)return;$('#w').textContent='…';
 try{const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language='+lg+'&name='+encodeURIComponent(c))).json();
 if(!g.results)throw 0;const p=g.results[0];
 const f=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=auto`)).json();
 const d=f.daily;$('#w').innerHTML=`<div class="card"><b>${esc(p.name)}, ${esc(p.admin1||'')}</b><table><tr><th>${T('day')}</th><th>${T('temp')}</th><th>${T('rain')}</th></tr>
 ${d.time.map((t,i)=>`<tr><td>${t.slice(5)}</td><td>${d.temperature_2m_min[i]}–${d.temperature_2m_max[i]}°C</td><td>${d.precipitation_probability_max[i]}% (${d.precipitation_sum[i]}mm)</td></tr>`).join('')}</table>
 ${d.precipitation_probability_max.slice(0,3).some(x=>x>60)?`<p class="err">${T('rainW')}</p>`:''}</div>`}
 catch{$('#w').innerHTML=`<p class="err">${T('noCity')}</p>`}
}
function acc(){
 if(me&&me.role==='farmer'){photoId='';$('#app').innerHTML=`<div class="card"><b>${T('addT')}</b>
 <input id="c" list="cl2" placeholder="${esc(T('crop'))}"><datalist id="cl2">${CROPS.map(([e,h])=>`<option value="${lg==='hi'?h:e}">`).join('')}</datalist>
 <input id="qt" type="number" min="0" placeholder="${esc(T('qty'))}"><input id="pr" type="number" min="0" placeholder="${esc(T('price'))}"><input id="pl" placeholder="${esc(T('place'))}">
 <label class="btn o">${T('photo')}<input id="pf" type="file" accept="image/*" hidden onchange="pick(this)"></label><div id="pv"></div>
 <p id="e" class="err"></p><button class="btn" onclick="addL()">${T('add')}</button></div><div id="ord"></div>`;return loadOrders()}
 if(me){$('#app').innerHTML=`<div class="card">${T('buyer')}</div><div id="ord"></div>`;return loadOrders()}
 const d=reg?'block':'none';
 $('#app').innerHTML=`<div class="card"><b>${reg?T('register'):T('login').slice(2)}</b>
 <select id="role" style="display:${d}"><option value="farmer">${T('imF')}</option><option value="buyer">${T('imB')}</option></select>
 <input id="nm" placeholder="${esc(T('name'))}" style="display:${d}"><input id="vl" placeholder="${esc(T('village'))}" style="display:${d}">
 <input id="ph" type="tel" maxlength="10" inputmode="numeric" placeholder="${esc(T('phone'))}"><input id="pw" type="password" placeholder="${esc(T('pass'))}">
 ${reg&&cfg.otp?`<button class="btn o" onclick="sendOtp()">${T('sendOtp')}</button><input id="ot" inputmode="numeric" maxlength="6" placeholder="${esc(T('otp'))}">`:''}
 <p id="e" class="err"></p><button class="btn" onclick="sub()">${reg?T('register'):T('login').slice(2)}</button> <button class="btn o" onclick="reg=!reg;acc()">${reg?T('login').slice(2):T('newAcc')}</button></div>`;
}
async function orderAsk(id,max){const q=prompt(T('qtyAsk')+' (max '+max+')');if(!q)return;
 try{await api('orders',{method:'POST',body:{listing:id,qty:q}});alert(T('orderSent'));go('acc')}catch(e){alert(errT(e))}}
async function act(id,a,body){try{await api(`orders/${id}/${a}`,{method:'POST',body:body||{}});loadOrders()}catch(e){alert(errT(e))}}
function rate(id){const s=prompt(T('rateAsk'));if(!s)return;act(id,'rate',{stars:s,text:prompt(T('reviewAsk'))||''})}
const B=(id,a,k)=>`<button class="btn o" onclick="act('${id}','${a}')">${T(k)}</button> `;
function actions(o){const f=o.role==='farmer',s=o.status;let x='';
 if(f&&s==='pending')x=B(o.id,'accept','accept')+B(o.id,'reject','reject');else if(f&&s==='accepted')x=B(o.id,'done','done');
 else if(!f&&(s==='pending'||s==='accepted'))x=B(o.id,'cancel','cancel');else if(!f&&s==='done'&&!o.rating)x=`<button class="btn o" onclick="rate('${o.id}')">${T('rate')}</button>`;
 if(o.rating)x+=`<div class="m">⭐${o.rating.stars}${o.rating.text?' — '+esc(o.rating.text):''}</div>`;return x}
async function loadOrders(){try{const os=await api('orders');
 $('#ord').innerHTML=`<h3>${T('orders')}</h3><p class="m">${T('payNote')}</p>`+(os.length?os.map(o=>`<div class="card"><div class="row"><b>${esc(o.crop)} • ${esc(o.qty)} ${T('qtl')}</b><span class="m">${T('s.'+o.status)}</span></div>
 <div class="m">${esc(o.role==='buyer'?o.farmerName:o.buyerName)} • ₹${o.qty*o.price}</div>${o.phone?`<a class="btn" href="tel:${esc(o.phone)}">${T('call')}</a> `:''}${actions(o)}</div>`).join(''):`<p class="m">${T('noOrders')}</p>`)}
 catch(e){$('#ord').innerHTML=`<p class="err">${esc(errT(e))}</p>`}}
async function sendOtp(){try{const d=await api('otp/send',{method:'POST',body:{phone:$('#ph').value}});$('#e').style.color='var(--g)';$('#e').textContent=T('otpSent')+(d.dev?' (dev: '+d.dev+')':'')}catch(e){$('#e').style.color='';$('#e').textContent=errT(e)}}
async function sub(){try{const b={phone:$('#ph').value,password:$('#pw').value};
 if(reg)Object.assign(b,{name:$('#nm').value,village:$('#vl').value,role:$('#role').value,otp:cfg.otp?$('#ot').value:undefined});
 setAuth(await api(reg?'register':'login',{method:'POST',body:b}));reg=false;go('bazaar')}catch(e){$('#e').textContent=errT(e)}}
function pick(inp){const f=inp.files[0];if(!f)return;const img=new Image();img.onload=async()=>{
